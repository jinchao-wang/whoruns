name: Build Android APK

on:
  workflow_dispatch:
  # 主干每次推送都构建。
  # 早先按路径过滤（只改 docs/ 就不构建），
  # 结果是「推了代码没动静」，容易让人以为自动构建坏了 —— 这里统一按分支触发。
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build 谁在偷跑 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 版本必须和本地开发时一致：平台脚手架由这个版本的
          # `flutter create` 生成，版本一变 Gradle/AGP 配置就可能对不上。
          flutter-version: '3.47.8'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里只跟踪 android/app/src 下的自有代码，
      # 其余平台脚手架（build.gradle、gradle wrapper、res/ 等）不入库，
      # 每次构建用 `flutter create` 重新生成。
      - name: Preserve custom source
        run: |
          mkdir -p /tmp/whoruns_src/lib
          cp -r lib/. /tmp/whoruns_src/lib/
          mkdir -p /tmp/whoruns_src/android/main
          cp android/app/src/main/AndroidManifest.xml /tmp/whoruns_src/android/main/
          mkdir -p /tmp/whoruns_src/android/kotlin
          cp -r android/app/src/main/kotlin/. /tmp/whoruns_src/android/kotlin/
          cp pubspec.yaml /tmp/whoruns_src/pubspec.yaml

      - name: Scaffold missing platform folders
        run: flutter create --platforms=android --project-name whoruns --org com.wjc .

      - name: Restore custom source
        run: |
          rm -rf lib
          mkdir -p lib
          cp -r /tmp/whoruns_src/lib/. lib/
          cp /tmp/whoruns_src/pubspec.yaml pubspec.yaml
          cp /tmp/whoruns_src/android/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin
          cp -r /tmp/whoruns_src/android/kotlin/. android/app/src/main/kotlin/

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 && code=0 || code=$?
          cat analyze.txt
          msg=$(tail -c 3000 analyze.txt | tr '\n\r' '  ' | sed 's/%/%25/g')
          echo "::error title=flutter analyze::${msg}"
          exit $code

      - name: Test
        run: |
          flutter test > test.txt 2>&1 && code=0 || code=$?
          cat test.txt
          msg=$(tail -c 3000 test.txt | tr '\n\r' '  ' | sed 's/%/%25/g')
          echo "::error title=flutter test::${msg}"
          exit $code

      # 原生侧的判定逻辑（谁在偷跑怎么判）也有单测，
      # 放在 android/app/src/test/kotlin 下。
      - name: Android native unit tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest -I ci-junit.gradle --console=plain > native-test.txt 2>&1 && code=0 || code=$?
          cat native-test.txt
          msg=$(tail -c 3000 native-test.txt | tr '\n\r' '  ' | sed 's/%/%25/g')
          echo "::error title=android native test::${msg}"
          exit $code

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whoruns-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
