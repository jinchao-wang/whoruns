name: Release

# 打一个 v1.0.0 这样的 tag，就自动构建双端并挂到 Release 上。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preserve custom source
        run: |
          mkdir -p /tmp/whoruns_src/lib
          cp -r lib/. /tmp/whoruns_src/lib/
          mkdir -p /tmp/whoruns_src/android/main
          cp android/app/src/main/AndroidManifest.xml /tmp/whoruns_src/android/main/
          mkdir -p /tmp/whoruns_src/android/kotlin
          cp -r android/app/src/main/kotlin/. /tmp/whoruns_src/android/kotlin/
          cp pubspec.yaml /tmp/whoruns_src/pubspec.yaml

      - name: Scaffold missing platform folders
        run: flutter create --platforms=android --project-name whoruns --org com.wjc .

      - name: Restore custom source
        run: |
          rm -rf lib
          mkdir -p lib
          cp -r /tmp/whoruns_src/lib/. lib/
          cp /tmp/whoruns_src/pubspec.yaml pubspec.yaml
          cp /tmp/whoruns_src/android/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin
          cp -r /tmp/whoruns_src/android/kotlin/. android/app/src/main/kotlin/

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test

      - name: Android native unit tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest -I ci-junit.gradle --console=plain

      - name: Build release APK
        run: flutter build apk --release

      - name: Copy APK to release folder
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/谁在偷跑-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            release/*.apk \
            --title "谁在偷跑 ${{ github.ref_name }}" \
            --generate-notes \
            --notes-start-tag "${{ github.ref_name }}^"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
