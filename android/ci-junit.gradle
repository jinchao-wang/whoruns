// 给 Android 模块注入 JUnit，用于跑 android/app/src/test 下的 JVM 单元测试。
//
// 为什么用 init script 而不是直接改 android/app/build.gradle？
// 仓库里只跟踪 android/app/src 这几个文件，build.gradle 是 CI 里由
// `flutter create` 临时生成的，直接改它每次构建都会被覆盖。
// init script 把这份配置放进版本库，CI 与本地行为完全一致。
//
// 用法：cd android && ./gradlew :app:testDebugUnitTest -I ci-junit.gradle

allprojects {
    plugins.withId('com.android.application') {
        dependencies {
            testImplementation 'junit:junit:4.13.2'
        }
    }
}
